<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Coming Soon</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;700&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
</head>

<body>
    <img src="/last (1).gif" alt="gif" class="gif1">
    <img src="/first (1).gif" alt="gif" class="gif">
    <div class="container">
        <div class="content">

            <img src="/coming-soon-ogo.webp" alt="" class="logo">
            <h1>Coming Soon!</h1>
            <p>We're working hard to launch our new website. </p>
            <p>Stay tuned for something amazing!</p>
            <div id="countdown">
                <div class="time">
                    <span id="days">00</span>
                    <p>Days</p>
                </div>
                <div class="time">
                    <span id="hours">00</span>
                    <p>Hours</p>
                </div>
                <div class="time">
                    <span id="minutes">00</span>
                    <p>Minutes</p>
                </div>
                <div class="time">
                    <span id="seconds">00</span>
                    <p>Seconds</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Countdown Timer Script
        const countdown = () => {
            const countDate = new Date("Oct 5, 2024 00:00:00").getTime();
            const now = new Date().getTime();
            const gap = countDate - now;

            const second = 1000;
            const minute = second * 60;
            const hour = minute * 60;
            const day = hour * 24;

            const days = Math.floor(gap / day);
            const hours = Math.floor((gap % day) / hour);
            const minutes = Math.floor((gap % hour) / minute);
            const seconds = Math.floor((gap % minute) / second);

            document.getElementById('days').innerText = days;
            document.getElementById('hours').innerText = hours;
            document.getElementById('minutes').innerText = minutes;
            document.getElementById('seconds').innerText = seconds;
        };

        setInterval(countdown, 1000);
    </script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init();
    </script>
</body>

</html>
